<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Shop DJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=Raleway:wght@500;600&family=Allura&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260920mc" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div>
        <h1>Coffee Shop DJ</h1>
        <p class="brand-eyebrow">Vinyl &middot; Spotify &middot; Live sets</p>
      </div>
      <p class="brand-script">Spin it slow, keep it warm.
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8.5 4.5-13.5 14-14 0 9-5 14-14 14z"/><path d="M5 19l8.5-8.5"/></svg>
      </p>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="live">Live Set</button>
      <button class="tab-btn" data-tab="crate">Crate Builder</button>
      <button class="tab-btn" data-tab="collection">Vinyl Corner</button>
      <button class="tab-btn" data-tab="spotifyCorner">Spotify Corner</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>
  </header>

  <main id="app">
    <section id="tab-live" class="tab-panel active"></section>
    <section id="tab-crate" class="tab-panel"></section>
    <section id="tab-collection" class="tab-panel"></section>
    <section id="tab-spotifyCorner" class="tab-panel"></section>
    <section id="tab-settings" class="tab-panel"></section>
  </main>

  <script type="module" src="js/app.js?v=20261006kp"></script>
</body>
</html>
